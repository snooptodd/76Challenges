<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>76 Challenges</title>
<style>
body { font-family: Arial, sans-serif; margin: 20px; }
table { border-collapse: collapse; margin-bottom: 20px; }
th, td { border: 1px solid #000; padding: 5px; }
th { background-color: #f0f0f0; }
caption h1 { margin: 10px 0; }
select, input[type=text] { margin: 5px; }
textarea { width: 100%; height: 300px; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ical.js/1.4.0/ical.min.js"></script>
</head>
<body>
<h1>Fallout 76 Challenges Dashboard</h1>
<div id="app"></div>
<script>
// ===================== Data Structures =====================
const DailyChallenge = Array.from({length: 12}, () => Array(4).fill(null));
const WeeklyChallenge = Array.from({length: 15}, () => Array(4).fill(null));
const MonthlyChallenge = Array.from({length: 5}, () => Array(4).fill(null));
const Location = ['', 'Arktos Pharma Biome Lab','Watoga High School','Uncanny Caverns','The Burning Mine', 'The Burrows', 'Vault 94', 'Valley Galleria','Watoga Raider Arena','Vault 96','West Tek Research Center','Charleston Capitol Building','Garrahan Mining Headquarters','Morgantown High School','The Foundry','Aquarium of the Atlantic','Glassed Caverns','Atlantic City Community Center'];
const EnemyFaction = ['', 'Communists','Blood Eagles','Super Mutants','Robots','Scorched','Mothman Cultists','Mole Miners','Aliens','Fanatics','Overgrown'];
let EnemyMutations1 = ['Piercing Gaze', 'Savage Strike'];
const EnemyMutations2 = ['', 'Reflective Skin','Piercing Gaze', 'Volatile', 'Active Camouflage', 'Resilient' ,'Freezing Touch','Toxic Blood','Group Regeneration','Swift-Footed','Blistering Cold: Freezing Touch and Swift-Footed Mutations','Chilling Mend: Freezing Touch and Group Regeneration Mutations','Clouded Toxins: Active Camouflage and Toxic Blood Mutations','Relentless: Resilient and Group Regeneration Mutations','Stinging Frost: Freezing Touch and Toxic Blood Mutations','Swift Stalker: Active Camouflage and Swift-Footed Mutations','Unstable: Volatile and Swift-Footed Mutations','Vaporous: Volatile and Active Camouflage Mutations','Danger Cloud'];

const MinervaLocations = [
    {start: '2025-11-10', end: '2025-11-12', location: 'Foundation', lists: ['1']},
    {start: '2025-11-17', end: '2025-11-19', location: 'The Crater', lists: ['2']},
    {start: '2025-11-24', end: '2025-11-26', location: 'Fort Atlas', lists: ['3']}
];
const MinervaInventory = [
    {list: '1', item: "Cattle Prod", cost: 188},
    {list: '1', item: "Chemist's Backpack Mod", cost: 263},
    {list: '2', item: "Farmable Dirt Tiles", cost: 375},
    {list: '3', item: "Gauss Minigun", cost: 2000}
];

function escapeHTML(str) {
    return str.replace(/[&<>"']/g, tag => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',''':'&#39;'}[tag] || tag);
}
function getDaysSinceEpoch() { return Math.floor(Date.now() / 1000 / (24 * 60 * 60)); }
if (getDaysSinceEpoch() % 2 === 1) { EnemyMutations1 = ['Savage Strike','Piercing Gaze']; }

function renderSelect(id, options, selectedValue) {
    const select = document.createElement('select');
    select.name = id; select.id = id;
    options.forEach(opt => { const option = document.createElement('option'); option.value = opt; option.textContent = opt; if (opt === selectedValue) option.selected = true; select.appendChild(option); });
    return select;
}
function renderChallengesTable(title, challenges, prefix) {
    const table = document.createElement('table');
    const caption = document.createElement('caption'); caption.innerHTML = `<h1>${title}</h1>`; table.appendChild(caption);
    const headerRow = document.createElement('tr'); headerRow.innerHTML = '<th>1st</th><th>Challenge</th>'; table.appendChild(headerRow);
    challenges.forEach((value, key) => { const row = document.createElement('tr'); const cell1 = document.createElement('td'); const input1 = document.createElement('input'); input1.type = 'text'; input1.name = `${prefix}${key}1st`; input1.value = value[3] || ''; cell1.appendChild(input1); const cell2 = document.createElement('td'); const input2 = document.createElement('input'); input2.type = 'text'; input2.name = `${prefix}${key}`; input2.value = value[0] || ''; cell2.appendChild(input2); row.appendChild(cell1); row.appendChild(cell2); table.appendChild(row); });
    return table;
}

async function fetchCalendar(url) {
    try {
        const response = await fetch(url);
        const text = await response.text();
        const jcalData = ICAL.parse(text);
        const comp = new ICAL.Component(jcalData);
        const events = comp.getAllSubcomponents('vevent');
        const eventsContainer = document.createElement('div'); eventsContainer.innerHTML = '<h2>Current Events</h2>'; const list = document.createElement('ul');
        events.forEach(event => { const e = new ICAL.Event(event); const li = document.createElement('li'); li.textContent = `${e.summary} (Ends: ${e.endDate.toJSDate().toDateString()})`; list.appendChild(li); });
        eventsContainer.appendChild(list); document.getElementById('app').appendChild(eventsContainer);
    } catch (err) { console.error('Error fetching calendar:', err); }
}

function axolotlRotation() {
    const now = new Date(); const year = now.getFullYear();
    const axolotlMap = [
        {name: 'Charcoal Axolotl', regions: 'Skyline Valley & Savage Divide'},
        {name: 'Pink Axolotl', regions: 'Cranberry Bog & Forest'},
        {name: 'Clay Axolotl', regions: 'Skyline Valley & Toxic Valley'},
        {name: 'Dotted Axolotl', regions: 'Mire & Ash Heap'},
        {name: 'Purple Axolotl', regions: 'Skyline Valley & Cranberry Bog'},
        {name: 'Banded Axolotl', regions: 'Toxic Valley & Mire'},
        {name: 'Scaled Axolotl', regions: 'Forest & Ash Heap'},
        {name: 'Striped Axolotl', regions: 'Skyline Valley & Mire'},
        {name: 'Shadow Axolotl', regions: 'Toxic Valley & Ash Heap'},
        {name: 'Spotted Axolotl', regions: 'Savage Divide & Toxic Valley'},
        {name: 'Speckled Axolotl', regions: 'Cranberry Bog & Forest'},
        {name: 'Stone Axolotl', regions: 'Toxic Valley & Ash Heap'}
    ];
    function firstTuesday(month) { const date = new Date(year, month, 1); while (date.getDay() !== 2) { date.setDate(date.getDate() + 1); } return date; }
    let currentIndex = 0; for (let i = 11; i >= 0; i--) { if (now >= firstTuesday(i)) { currentIndex = i; break; } }
    const currentAxolotl = axolotlMap[currentIndex]; const nextChangeDate = firstTuesday((currentIndex + 1) % 12);
    const container = document.createElement('div'); container.innerHTML = `<h2>Monthly Axolotl</h2><p><strong>${currentAxolotl.name}</strong><br>Regions: ${currentAxolotl.regions}<br>Changes on: ${nextChangeDate.toDateString()}</p>`; document.getElementById('app').appendChild(container);
}

function minervaStatus() {
    const now = new Date(); let currentLocation = 'Away'; let nextLocation = ''; let currentLists = [];
    MinervaLocations.forEach(loc => { const start = new Date(loc.start); const end = new Date(loc.end); if (now >= start && now <= end) { currentLocation = loc.location; currentLists = loc.lists; } if (!nextLocation && start >= now) { nextLocation = `She will next be at ${loc.location} on ${start.toDateString()}`; } });
    const container = document.createElement('div'); container.innerHTML = '<h2>Minerva</h2>';
    if (currentLocation === 'Away') { container.innerHTML += `<p><strong>Minerva's Location:</strong> ${currentLocation}<br>${nextLocation}</p>`; } else { container.innerHTML += `<p><strong>Minerva's Location:</strong> ${currentLocation}</p>`; const list = document.createElement('ul'); MinervaInventory.forEach(item => { if (currentLists.includes(item.list)) { const discounted = Math.round(item.cost * 0.75); const li = document.createElement('li'); li.textContent = `${item.item} (${discounted} gold)`; list.appendChild(li); } }); container.appendChild(list); }
    document.getElementById('app').appendChild(container);
}

document.addEventListener('DOMContentLoaded', () => {
    const app = document.getElementById('app');
    app.appendChild(renderChallengesTable('Weekly Challenges', WeeklyChallenge, 'w'));
    app.appendChild(renderChallengesTable('Daily Challenges', DailyChallenge, 'd'));
    app.appendChild(renderChallengesTable('Monthly Challenges', MonthlyChallenge, 'm'));
    app.appendChild(renderSelect('Location', Location, ''));
    app.appendChild(renderSelect('EnemyFaction', EnemyFaction, ''));
    app.appendChild(renderSelect('EnemyMutations1', EnemyMutations1, ''));
    app.appendChild(renderSelect('EnemyMutations2', EnemyMutations2, ''));
    fetchCalendar('https://calendar.google.com/calendar/ical/677a43e0ffb5d922130f03876fe8c0bea6cb2fa558a7f50574cbbaa75564c74e%40group.calendar.google.com/public/basic.ics');
    axolotlRotation();
    minervaStatus();
});
</script>
</body>
</html>
