// Google API client configuration and helper functions
const GAPI_CLIENT_ID = '1003932562826-to5gbs5u7flo1jik55mijep1h2tpv2k3.apps.googleusercontent.com';
const GAPI_API_KEY = 'AIzaSyD2wJYJTZjm-cEFIFJa3zu3oZIQxVREiw4';
const GAPI_DISCOVERY_DOCS = ['https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest'];
const GAPI_SCOPES = 'https://www.googleapis.com/auth/calendar.readonly';
let gapiInitialized = false;
function loadGapiScript() {
    return new Promise((resolve, reject) => {
        if (window.gapi) return resolve(window.gapi);
        const s = document.createElement('script');
        s.src = 'https://apis.google.com/js/api.js';
        s.async = true;
        s.defer = true;
        s.onload = () => resolve(window.gapi);
        s.onerror = reject;
        document.head.appendChild(s);
    });
}

async function loadGisScript() {
    return new Promise((resolve, reject) => {
        if (window.google && window.google.accounts && window.google.accounts.oauth2) return resolve(window.google);
        const s = document.createElement('script');
        s.src = 'https://accounts.google.com/gsi/client';
        s.async = true;
        s.defer = true;
        s.onload = () => resolve(window.google);
        s.onerror = reject;
        document.head.appendChild(s);
    });
}

async function initGoogleClient() {
    if (gapiInitialized) return window.gapi;
    // load gapi client & init only the client part (no auth2)
    await loadGapiScript();
    await new Promise((resolve) => window.gapi.load('client', resolve));
    await window.gapi.client.init({ apiKey: GAPI_API_KEY, discoveryDocs: GAPI_DISCOVERY_DOCS });
    // load GIS and create token client for OAuth
    await loadGisScript();
    // create token client that will supply an access token for gapi.client requests
    window.gisTokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GAPI_CLIENT_ID,
        scope: GAPI_SCOPES,
        callback: (resp) => {
            if (resp.error) {
                console.error('GIS token error', resp);
                return;
            }
            // set token for gapi.client usage
            window.gapi.client.setToken({ access_token: resp.access_token });
            // optional hook for callers waiting on auth
            if (typeof window.onGisAuth === 'function') window.onGisAuth(resp);
            // update any visible auth UI
            try { if (typeof updateAuthUI === 'function') updateAuthUI(); } catch (e) { /* ignore */ }
        }
    });
    gapiInitialized = true;
    return window.gapi;
}

function isAuthorized() {
    try {
        const t = window.gapi && window.gapi.client && window.gapi.client.getToken && window.gapi.client.getToken();
        return !!(t && t.access_token);
    } catch (e) { return false; }
}

// Update auth controls UI (status + sign-in/sign-out buttons)
function updateAuthUI() {
    const container = document.getElementById('authControls');
    if (!container) return;
    container.innerHTML = '';
    const status = document.createElement('span');
    status.id = 'authStatus';
    status.style.marginRight = '8px';

    container.appendChild(status);

    if (isAuthorized()) {
        const btn = document.createElement('button');
        btn.textContent = 'Sign Out';
        btn.addEventListener('click', async () => { try { await signOut(); } catch (e) { console.error(e); } });
        container.appendChild(btn);
    } else {
        const btn = document.createElement('button');
        btn.textContent = 'Sign In';
        btn.addEventListener('click', async () => { try { await signIn(); } catch (e) { console.error(e); } });
        container.appendChild(btn);
    }
}

// Sign-in helper that waits for the GIS callback and resolves when token is available
// Accepts an optional `onSignedInCallback` which will be called after sign-in completes.
function signIn(onSignedInCallback) {
    return new Promise(async (resolve, reject) => {
        try {
            await initGoogleClient();
        } catch (e) {
            return reject(e);
        }
        const existing = window.gapi && window.gapi.client && window.gapi.client.getToken && window.gapi.client.getToken();
        // setup temporary handler before requesting token to avoid race
        const timeout = setTimeout(() => {
            window.onGisAuth = null;
            reject(new Error('GIS auth timeout'));
        }, 30000);
        window.onGisAuth = async (resp) => {
            clearTimeout(timeout);
            window.onGisAuth = null;
            if (resp && resp.error) return reject(resp);
            try { if (typeof updateAuthUI === 'function') updateAuthUI(); } catch (e) {}
            // call optional callback after UI update
            try { if (typeof onSignedInCallback === 'function') onSignedInCallback(resp); } catch (e) { console.error('onSignedInCallback error', e); }
            try {
                // after resolving, run any queued post-auth actions asynchronously and in sequence
                const q = Array.isArray(window.postAuthQueue) ? window.postAuthQueue : [];
                if (q && q.length) {
                    // drain by awaiting each action; support async functions that return promises
                    while (q.length) {
                        const fn = q.shift();
                        try {
                            const result = fn && typeof fn === 'function' ? fn() : null;
                            if (result && typeof result.then === 'function') {
                                // await promise-like results
                                await result;
                            }
                        } catch (e) {
                            console.error('postAuth action error', e);
                        }
                    }
                }
                window.postAuthQueue = [];
            } catch (e) { console.error('postAuth queue run error', e); }
            resolve(resp);
        };
        try {
            window.gisTokenClient.requestAccessToken({ prompt: existing ? '' : 'consent' });
        } catch (err) {
            clearTimeout(timeout);
            window.onGisAuth = null;
            reject(err);
        }
    });
}

// Sign out and revoke token (if present)
async function signOut() {
    try {
        const t = window.gapi && window.gapi.client && window.gapi.client.getToken && window.gapi.client.getToken();
        if (t && t.access_token && window.google && window.google.accounts && window.google.accounts.oauth2) {
            // revoke via google.accounts.oauth2.revoke
            await new Promise((resolve) => {
                try {
                    google.accounts.oauth2.revoke(t.access_token, () => { resolve(); });
                } catch (e) { resolve(); }
            });
        }
        if (window.gapi && window.gapi.client && window.gapi.client.setToken) window.gapi.client.setToken('');
    } catch (e) {
        console.error('signOut error', e);
    }
    try { if (typeof updateAuthUI === 'function') updateAuthUI(); } catch (e) {}
}

// Post-auth action queue helpers
window.postAuthQueue = window.postAuthQueue || [];
function enqueuePostAuthAction(fn) {
    if (typeof fn === 'function') {
        window.postAuthQueue = window.postAuthQueue || [];
        window.postAuthQueue.push(fn);
    }
}

// Helper: format an event end date as dMonYYYY (e.g. 3Nov1999)
function formatEndDate(end) {
    if (!end) return '';
    // end may be an object with .date (YYYY-MM-DD) or .dateTime
    const ds = end.date || end.dateTime || end;
    const d = new Date(ds);
    const day = d.getDate();
    const year = d.getFullYear();
    const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${day}-${monthNames[d.getMonth()]}-${year}`;
}

async function loadChallenges() {
    // load but don parse challenges.txt
    // challenges will be parsed by the markdown or json build functions.
    // Fetch challenges and create datalist for each category
    // input file format: Challenge|count|Type|Flair|Reward|FormID
    const response = await fetch('challenges.txt');
    const text = await response.text();
    const lines = text.trim().split('\r\n');
    const categories = { Daily: [], Weekly: [], Monthly: [], Event: [] };
    lines.forEach(line => {
        const parts = line.split('|');
        if (parts.length >= 2) {
            const challenge = parts[0];
            const count = parts[1];
            const type = parts[2];
            const flair = parts[3];
            const reward = parts[4];
            const formID = parts[5];
            if (categories[type]) { 
                // categories[type].push({ text: `${flair} ${challenge} ${reward}` });
                categories[type].push({ text: `${line}` });
            }
        }
    });
    // Populate datalists
    for (const [category, challenges] of Object.entries(categories)) {
        const datalist = document.getElementById(category);
        challenges.forEach(challenge => {
            const option = document.createElement('option');
            option.value = challenge.text;
            datalist.appendChild(option);
        });
        // Create input text boxes for each category
        await inputtext(13, category);

        // Hide Monthly and Event containers by default (optional for most users)
        if (category === 'Monthly' || category === 'Event') {
            const container = document.getElementById(`${category}Container`);
            if (container) {
                container.style.display = 'none';
                container.classList.add('optional-challenges');
            }
        }
    }
}

async function minervaStatus() {
    const locationResponse = await fetch('MinervaLocation.txt');
    const inventoryResponse = await fetch('MinervaEnventory.txt');
    const locationText = await locationResponse.text();
    const inventoryText = await inventoryResponse.text();
    const locations = locationText.trim().split('\r\n').map(line => { const [start, end, loc, lists] = line.split(','); return { start: new Date(start), end: new Date(end), location: loc, lists: lists.split('|') }; });
    const inventory = inventoryText.trim().split('\r\n').map(line => { const [list, item, cost] = line.split('|'); return { list: list, item: item, cost: parseInt(cost) }; });
    const now = new Date(); let currentLocation = 'Away'; let nextLocation = ''; let currentLists = []; let nextDate = null; let currentLeaveDate = null;
    locations.forEach(loc => { 
        if (now >= loc.start && now <= loc.end) { 
            currentLocation = loc.location; currentLists = loc.lists; currentLeaveDate = loc.end;
        } 
        if (!nextLocation && loc.start >= now) { 
            // format the date for consistent display
            // nextLocation = `She will next be at ${loc.location} on ${formatEndDate(loc.start.toISOString())}`;
            nextLocation = loc.location; nextDate = loc.start;
        } 
    });
    // write into the existing Minerva area (capital M in HTML). fall back to #minerva if needed
    let container = document.getElementById('Minerva') || document.getElementById('minerva');
    if (!container) {
        container = document.createElement('div');
        container.id = 'Minerva';
        document.getElementById('app').appendChild(container);
    }
    container.innerHTML = '<h2>Minerva</h2>';
    if (currentLocation === 'Away') { 
        container.innerHTML += `<p><strong>Minerva's Location:</strong> ${currentLocation}</p><p>She will next be at ${nextLocation} on ${formatEndDate(nextDate.toISOString())}</p>`; 
    } else { 
        container.innerHTML += `<p><strong>Minerva's Location:</strong> ${currentLocation}</p><p>She will next be at ${nextLocation} on ${formatEndDate(nextDate.toISOString())}</p><p>She will leave on ${formatEndDate(currentLeaveDate.toISOString())}</p>`;
        const list = document.createElement('ul'); 
        // sort inventory alphabetically by item name
        inventory.sort((a,b) => a.item.localeCompare(b.item));
        inventory.forEach(item => { 
            if (currentLists.includes(item.list)) { 
                const discounted = Math.round(item.cost * 0.75); 
                const li = document.createElement('li'); 
                li.textContent = `${item.item} (${discounted} gold)`; 
                list.appendChild(li); 
            } 
        }); 
        container.appendChild(list); 
    }
}

                try { updateAuthUI(); } catch (e) { /* ignore */ }
            // fallback to public API key fetch (may fail for private calendar)
            const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events?key=${GAPI_API_KEY}&timeMin=${encodeURIComponent(timeMin)}&timeMax=${encodeURIComponent(timeMax)}&singleEvents=true&orderBy=startTime`;
            const res = await fetch(url);
            if (!res.ok) {
                // if unauthorized, let user sign in via button
                if (res.status === 403 || res.status === 401) {
                    container.innerHTML += '<p>Calendar requires authorization. Please sign in to Google.</p>';
                }
                throw new Error(`Calendar fetch failed: ${res.status}`);
            }
            const data = await res.json();
            allItems = Array.isArray(data.items) ? data.items.filter(i => i.status !== 'cancelled') : [];
        }

        // helper to format end date as dMonYYYY (e.g. 3Nov1999) — uses top-level `formatEndDate`

        // sort by end date ascending
        allItems.sort((a,b) => {
            const aEnd = new Date(a.end.dateTime || a.end.date);
            const bEnd = new Date(b.end.dateTime || b.end.date);
            return aEnd - bEnd;
        });

        // if an atomic shop event is = 21 days long and its start is 7 or more days ago, don't show it.
        // check for evnets that end today and filter them out. (they should not appeear in ev but just in case)
        const weeklyItems = allItems.filter(ev => {
            if (!ev.start) return false;
            if (!ev.end) return false;
            const startDate = new Date(ev.start.dateTime);
            const endDate = new Date(ev.end.dateTime);
            const durationDays = Math.round((endDate - startDate) / (24 * 60 * 60 * 1000));
            const ageDays = Math.round((Date.now() - startDate.getTime()) / (24 * 60 * 60 * 1000));
            if (durationDays === 21 && ageDays >= 7) return false;
            if (endDate < now) return false;
            return true;
        });

        if (weeklyItems.length === 0) {
            container.innerHTML += '<p>No atomic shop items found that started on Tuesday of this week.</p>';
            return;
        }

        const list = document.createElement('ul');
        weeklyItems.forEach(ev => {
            const end = ev.end || {};
            const li = document.createElement('li');
            li.textContent = `${ev.summary}, Leaves on (${formatEndDate(end)})`;
            list.appendChild(li);
        });
        container.appendChild(list);
    } catch (err) {
        console.error('atomicShop error:', err);
        const container = document.getElementById('atomicShop') || document.getElementById('app');
        if (container) container.innerHTML = '<h2>Atomic Shop</h2><p>Error loading atomic shop items.</p>';
    }
}

async function event(ev) {
    // ev is the calendar event object whose summary starts with 'EVENT'
    if (!ev) return;
    try {
        const container = document.getElementById('event') || document.getElementById('app');
        if (!container) return;
        // create a subsection for this event
        const section = document.createElement('div');
        const rawSummary = ev.summary || '';
        const title = rawSummary.replace(/^EVENT\s*/i, '');
        section.innerHTML = `<h2>${title}</h2>`;
        const desc = ev.description || '';
        if (desc.trim()) {
            const ul = document.createElement('ul');
            desc.split(/\r?\n/).map(s => s.trim()).filter(Boolean).forEach(line => {
                // if starts with - then make it a nested list item.
                if (line.startsWith('-')) {
                    let lastLi = ul.lastElementChild;
                    if (!lastLi) {
                        lastLi = document.createElement('li');
                        ul.appendChild(lastLi);
                    }
                    let nestedUl = lastLi.querySelector('ul');
                    if (!nestedUl) {
                        nestedUl = document.createElement('ul');
                        lastLi.appendChild(nestedUl);
                    }
                    const nestedLi = document.createElement('li');
                    nestedLi.textContent = line.slice(1).trim();
                    nestedUl.appendChild(nestedLi);
                    return;
                } else {
                    const li = document.createElement('li');
                    li.textContent = line;
                    ul.appendChild(li);
                }
            });
            section.appendChild(ul);
        }
        container.appendChild(section);
    } catch (e) { console.error('event() error', e); }
}

function buildJson() {
    const out = {
        "Atom Shop": { entries: [] },
        "Current Events": { entries: [] },
        "Axolotl": { CurrentAxolotl: '', Regions: '', NextChange: '' },
        "Special Events": { Title: '', entries: [] },
        "Daily Challenges": { entries: [] },
        "Weekly Challenges": { entries: [] },
        "Monthly Challenges": { entries: [] },
        "Minerva": { Location: '', LeavesOn: '', NextLocation: '', NextLeavesOn: '', entries: [] },
        "DailyOp": { Mode: '', Location: '', Enemy: '', Mutation1: '', Mutation2: '' }
    };

    // Atom Shop
    document.querySelectorAll('#atomicShop li').forEach(li => {
        const raw = li.textContent.trim();
        const Match = raw.match(/^(.*)\((\d+⚛️.*|Free!?)\),.*\((\d+-\w+-\d+)\)\s*$/);
        const Text = Match ? Match[1].trim(): '';
        const Atoms = Match ? Match[2].trim() : '';
        const DateLeaves = Match ? Match[3].trim() : '';
        out['Atom Shop'].entries.push({ Text, Atoms, DateLeaves });
    });

    // Current Events
    document.querySelectorAll('#currentEvents li').forEach(li => {
        const raw = li.textContent.trim();
        const TextMatch = raw.match(/^(.*),\s*(Ends on|Estimated end date)\s*\(([^)]+)\)\s*$/);
        const Text = TextMatch ? TextMatch[1].trim() : '';
        const Estimated = /Estimated/i.test(raw);
        const dateMatch = raw.match(/\(([^)]+)\)\s*$/);
        const DateLeaves = dateMatch ? dateMatch[1].trim() : '';
        out['Current Events'].entries.push({ Text, Estimated, DateLeaves });
    });

    // Axolotl
    const axolotlDiv = document.getElementById('axolotl');
    if (axolotlDiv) {
        const p = axolotlDiv.querySelector('p');
        if (p) {
            const text = p.innerText.trim();
            const nameMatch = text.match(/^(.+?)\s+Regions:/);
            const regionsMatch = text.match(/Regions:\s+(.+?)\s+Changes on:/);
            const changeMatch = text.match(/Changes on:\s*\(([^)]+)\)/);
            if (nameMatch) out['Axolotl'].CurrentAxolotl = nameMatch[1].trim();
            if (regionsMatch) out['Axolotl'].Regions = regionsMatch[1].trim();
            if (changeMatch) out['Axolotl'].NextChange = changeMatch[1].trim();
        }
    }   

    // Special Events - use first h2 in #event as Title if present
    // an event with children will have 
    // {"Text":"","Count":"","Reward":"","Subentries":[{"text":"","Count":"","Reward":""},...]}
    // event format is h2 + ul > li (with possible nested ul > li)
    // each event format is text (xCount) reward
    const eventContainer = document.getElementById('event');
    if (eventContainer) {
        const firstH2 = eventContainer.querySelector('h2');
        if (firstH2) out['Special Events'].Title = firstH2.innerText.trim();
        // add entries for each subsection (h2 + its list items)
        // need to account for nested structure
        Array.from(eventContainer.children).forEach(section => {
            const title = section.querySelector('h2')?.innerText?.trim() || '';
            if (!title) return;
            // handle top-level list items and preserve nested lists as a nested array
            const topLevelLis = Array.from(section.querySelectorAll(':scope > ul > li'));
            if (topLevelLis.length) {
                topLevelLis.forEach(li => {
                    // get the text of the li excluding any nested UL text
                    let text = count = reward = '';
                    li.childNodes.forEach(node => {
                        if (node.nodeType === Node.ELEMENT_NODE && (node.tagName.toLowerCase() === 'ul' || node.tagName.toLowerCase() === 'ol')) {
                            return; // skip nested lists
                        }
                        const Mtext = node.textContent.match(/^(.*)\(x/);
                        const Mcount = node.textContent.match(/\(x(\d+)\)/);
                        const Mreward = node.textContent.match(/x\d+\) (.*)$/);
                            text = Mtext ? Mtext[1].trim() : node.textContent.trim();
                            count = Mcount ? Mcount[1].trim() : '';
                            reward= Mreward ? Mreward[1].trim() : '';
                    });

                    // collect direct nested list items (one level deep)
                    const nested = Array.from(li.querySelectorAll(':scope > ul > li')).map(n => {
                        let nText = nCount = nReward = '';
                        n.childNodes.forEach(nNode => {
                            if (nNode.nodeType === Node.ELEMENT_NODE && (nNode.tagName.toLowerCase() === 'ul' || nNode.tagName.toLowerCase() === 'ol')) {
                                return; // skip deeper nested lists
                            }
                            const nMtext = nNode.textContent.match(/^(.*)\(x/);
                            const nMcount = nNode.textContent.match(/\(x(\d+)\)/);
                            const nMreward = nNode.textContent.match(/x\d+\) (.*)$/);
                            nText = nMtext ? nMtext[1].trim() : nNode.textContent.trim();
                            nCount = nMcount ? nMcount[1].trim() : '';
                            nReward= nMreward ? nMreward[1].trim() : '';
                        });
                        return { Text: nText, Count: nCount, Reward: nReward };
                    });

                    if (nested.length) {
                        out['Special Events'].entries.push({
                            Text: text,
                            Count: count,
                            Reward: reward,
                            Subentries: nested
                        });
                    } else {
                        out['Special Events'].entries.push({
                            Text: text,
                            Count: count,
                            Reward: reward
                        });
                    }
                });
            } else {
                // fallback: no lists found, use title as single entry
                out['Special Events'].entries.push({ Text: title, Count: '', Reward: '' });
            }
        });
    }

    // Challenges helper
    function extractChallengeContainer(containerId, targetKey) {
        const container = document.getElementById(containerId + 'Container');
        if (!container) return;
        const inputs = container.querySelectorAll('input.checkbox, input.textbox');
        for (let i = 0; i < inputs.length; i += 2) {
            const checkbox = inputs[i];
            const input = inputs[i + 1];
            if (!input) continue;
            const raw = input.dataset.text || input.value || '';
            if (!raw) continue;
            // format Challenge|count|Type|Flair|Reward|FormID
            const Match = raw.split('|');
            const FoFirst = checkbox.checked ? '1ˢᵗ' : '';
            const Text = Match ? Match[0].trim() : '';
            const Count = Match ? Match[1].trim() : '';
            const Flair2 = Match ? Match[3].trim() : '';
            const Reward= Match ? Match[4].trim() : '';
            const FormID = Match ? Match[5].trim() : '';
            // for now cat FoFirst and flair2 together
            const Flair = FoFirst && Flair2 ? `${FoFirst} ${Flair2}` : (FoFirst || Flair2);
            // doube reward if double score event is active and is daily challenges
            if (targetKey === 'Daily Challenges') {
                const currentEvents = out['Current Events'].entries;
                const doubleActive = currentEvents.some(ev => /Double S/i.test(ev.Text));
                if (doubleActive && Reward) {
                    const doubled = parseInt(Reward, 10) * 2;
                    out['Daily Challenges'].entries.push({ Flair, Text, Count, Reward: `${doubled}`, FormID });
                    continue;
                }
            }
            out[targetKey].entries.push({ Flair, Text, Count, Reward, FormID });
        }
    }

    extractChallengeContainer('Daily', 'Daily Challenges');
    extractChallengeContainer('Weekly', 'Weekly Challenges');
    extractChallengeContainer('Monthly', 'Monthly Challenges');

    // Minerva
    // needs to parse location, next location, leaves on and entries
    const minerva = document.getElementById('Minerva');
    if (minerva) {
        const p = minerva.querySelector('p');
        if (p) out['Minerva'].Location = p.innerText.replace(/Minerva's Location:\s*/i, '').trim();
        const secondP = minerva.querySelectorAll('p')[1];
        if (secondP) {
            const txt = secondP.innerText.trim();
            // try to parse 'She will next be at LOCATION on DATE'
            const m = txt.match(/She will next be at\s+(.+)\s+on\s+(.+)/i);
            if (m) {
                out['Minerva'].NextLocation = m[1].trim();
                out['Minerva'].NextLeavesOn = m[2].trim();
            } else {
                out['Minerva'].NextLeavesOn = txt;
            }
        }
        const thirdP = minerva.querySelectorAll('p')[2];
        if (thirdP) {
            const txt = thirdP.innerText.trim();
            // try to parse 'She will leave on DATE'
            const m = txt.match(/She will leave on\s+(.+)/i);
            if (m) out['Minerva'].LeavesOn = m[1].trim();
            else out['Minerva'].LeavesOn = txt;
        }
        minerva.querySelectorAll('li').forEach(li => {
            const t = li.textContent.trim();
            const m = t.match(/(.+)\((\d+)\s*gold\)/i);
            if (m) out['Minerva'].entries.push({ Plan: m[1].trim(), Gold: `${m[2]}` });
            else out['Minerva'].entries.push({ Plan: t, Gold: '' });
        });
    }

    // DailyOp
    const mut1 = document.querySelector('#dailyOps input[list="EnemyMut1List"]')?.value || '';
    const mut2 = document.querySelector('#dailyOps input[list="EnemyMut2List"]')?.value || '';
    const loc = document.querySelector('#dailyOps input[list="LocationList"]')?.value || '';
    const enemy = document.querySelector('#dailyOps input[list="EnemyFactionList"]')?.value || '';
    const Mode = mut1 === 'Savage Strike' ? 'Decryption' : 'Uplink';
    out['DailyOp'] = { Mode, Location: loc, Enemy: enemy, Mutation1: mut1, Mutation2: mut2 };

    // dump to textarea
    const textarea = document.getElementById('markdownOutput');
    if (textarea) textarea.value = JSON.stringify(out, null, 2);
}

            // paragraphs become bullet lines
            section.querySelectorAll('p').forEach(p => { if (p.innerText.trim()) markdown += `* ${p.innerText.trim()}\r\n`; });

            // render lists preserving nesting
            function getLiText(li) {
                let text = '';
                li.childNodes.forEach(node => {
                    if (node.nodeType === Node.ELEMENT_NODE && (node.tagName.toLowerCase() === 'ul' || node.tagName.toLowerCase() === 'ol')) {
                        // skip nested lists here
                        return;
                    }
                    text += node.textContent || '';
                });
                return text.trim();
            }
            function renderList(ul, depth = 0) {
                const indent = '  '.repeat(depth);
                Array.from(ul.children).forEach(li => {
                    if (li.tagName.toLowerCase() !== 'li') return;
                    const text = getLiText(li);
                    if (text) markdown += `${indent}* ${text}\r\n`;
                    // render any direct nested ULs inside this LI
                    Array.from(li.querySelectorAll(':scope > ul')).forEach(nested => renderList(nested, depth + 1));
                });
            }

            // find top-level ULs inside the section (skip ULs that are inside LIs)
            Array.from(section.querySelectorAll('ul')).forEach(ul => {
                if (ul.parentElement && ul.parentElement.tagName.toLowerCase() === 'li') return; // nested, handled by parent
                renderList(ul, 0);
            });
        });

    // if no challenges selected then do not include section

    // account for double score weekends.

                const CountText = parts[1] || '';

                }
                categoryMarkdown += `* ${fo1stText} ${FlairText} ${challengeText} (x${CountText}) ${RewardText}\r\n`;

        }

        }

    // minerva

        markdown += `${nextText}\r\n`;
    } else {
        document.querySelectorAll('#Minerva li').forEach(li => { markdown += `* ${li.innerText}\r\n`; });
    }

    markdown += '\r\n';
    // daily ops
    // if mutation 1 is savage strike then title is Daily OPS: Decryption else Daily OPS: Uplink
    // markdown should look like:
    // **Daily OPS: Decryption**
    // * Location: Watoga Raider Arena
    // * Enemy Faction: Scorched
    // * Enemy Mutations: Savage Strike, Vaporous: Volatile and Active Camouflage Mutations
    const mut1 = document.querySelector('#dailyOps input[list="EnemyMut1List"]')?.value || '';
    const mut2 = document.querySelector('#dailyOps input[list="EnemyMut2List"]')?.value || '';
    const location = document.querySelector('#dailyOps input[list="LocationList"]')?.value || '';
    const faction = document.querySelector('#dailyOps input[list="EnemyFactionList"]')?.value || '';
    const dailyOpsTitle = mut1 === 'Savage Strike' ? 'Daily OPS: Decryption' : 'Daily OPS: Uplink';
    markdown += `**${dailyOpsTitle}**\r\n`;
    if (location) markdown += `* Location: ${location}\r\n`;
    if (faction) markdown += `* Enemy Faction: ${faction}\r\n`;
    if (mut1 || mut2) {
        const mutations = [mut1, mut2].filter(Boolean).join(', ');
        markdown += `* Enemy Mutations: ${mutations}\r\n`;
    }
    // output to textarea    
    document.getElementById('markdownOutput').value = markdown;
    // const blob = new Blob([markdown], { type: 'text/plain' });
    // const url = URL.createObjectURL(blob);
    // const a = document.createElement('a'); a.href = url; a.download = 'dashboard_export.md'; a.click(); URL.revokeObjectURL(url);
});

document.getElementById('copyBtn').addEventListener('click', () => {
    const textarea = document.getElementById('markdownOutput');
    textarea.select();
    document.execCommand('copy');
    alert('Markdown copied to clipboard!');
});

function toggleOptionalChallenges() {
    const containers = document.querySelectorAll('.optional-challenges');
    if (!containers.length) return;
    // all optional containers share the same visibility state; check first
    const hidden = containers[0].style.display === 'none';
    containers.forEach(c => { c.style.display = hidden ? '' : 'none'; });
    const btn = document.getElementById('toggleOptionalBtn');
    if (btn) btn.textContent = hidden ? 'Hide Monthly & Event Challenges' : 'Show Monthly & Event Challenges';
}

document.addEventListener('DOMContentLoaded', () => {
    loadChallenges();
    dailyOps();
    // initialize Google API client (loads the script) and populate atomic shop
    initGoogleClient().then(() => { try { updateAuthUI(); } catch (e) {} }).catch(() => { try { updateAuthUI(); } catch (e) {} });
    atomicShop();
    currentEvents();
    axolotlRotation();
    minervaStatus();

    // add toggle button next to export/copy controls to allow users to show/hide Monthly & Event challenges
    const controlsDiv = document.querySelector('div[style*="text-align:center"]');
    if (controlsDiv && !document.getElementById('toggleOptionalBtn')) {
        const toggleBtn = document.createElement('button');
        toggleBtn.id = 'toggleOptionalBtn';
        toggleBtn.textContent = 'Show Monthly & Event Challenges';
        toggleBtn.addEventListener('click', toggleOptionalChallenges);
        // insert before export button so it's visible
        const exportBtn = document.getElementById('exportBtn');
        controlsDiv.insertBefore(toggleBtn, exportBtn);
    }
});
</script>
