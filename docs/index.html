<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Index — 76Challenges</title>
    <style>
        :root{font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial}
        body{max-width:900px;margin:36px auto;padding:0 18px;color:#111}
        header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
        h1{font-size:1.25rem;margin:0}
        input[type="search"]{flex:1;padding:8px;border:1px solid #ccc;border-radius:6px}
        ul{list-style:none;padding:0;margin:18px 0}
        li{padding:10px 12px;border:1px solid #eee;border-radius:8px;margin-bottom:10px}
        a{color:inherit;text-decoration:none;display:block}
        .meta{font-size:.85rem;color:#666;margin-top:6px}
        .empty{color:#777;padding:24px;border:1px dashed #ddd;border-radius:8px}
    </style>
</head>
<body>
    <header>
        <h1>76Challenges — Index</h1>
        <input id="q" type="search" placeholder="Filter pages..." aria-label="Search pages" />
    </header>

    <main>
        <ul id="pages" aria-live="polite"></ul>
        <div id="empty" class="empty" hidden>
            No pages found. Edit this file and add entries to the pagesList array or create a pages.json in this directory.
        </div>
    </main>

    <script>
        // Add static entries here if you prefer to maintain the index manually:
        const pagesList = [
            // Example:
            // { title: 'Challenge 01 — Hello', href: 'challenge-01.html', description: 'Intro page' }
        ];

        const pagesEl = document.getElementById('pages');
        const emptyEl = document.getElementById('empty');
        const q = document.getElementById('q');

        function render(list) {
            pagesEl.innerHTML = '';
            if (!list.length) {
                emptyEl.hidden = false;
                return;
            }
            emptyEl.hidden = true;
            list.forEach(p => {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = p.href;
                a.textContent = p.title || p.href;
                li.appendChild(a);
                if (p.description) {
                    const md = document.createElement('div');
                    md.className = 'meta';
                    md.textContent = p.description;
                    li.appendChild(md);
                }
                pagesEl.appendChild(li);
            });
        }

        function filterAndRender(all) {
            const term = q.value.trim().toLowerCase();
            if (!term) return render(all);
            const filtered = all.filter(p =>
                (p.title || p.href || '').toLowerCase().includes(term) ||
                (p.description||'').toLowerCase().includes(term)
            );
            render(filtered);
        }

        // 1) Try pages.json (create this file to control the index)
        fetch('pages.json').then(r => {
            if (!r.ok) throw new Error('no pages.json');
            return r.json();
        }).then(data => {
            const list = Array.isArray(data) ? data : [];
            render(list);
            q.addEventListener('input', () => filterAndRender(list));
        }).catch(() => {
            // 2) Try server directory listing (some servers return an index of files)
            const dirUrl = window.location.pathname.replace(/index\.html$/, '');
            fetch(dirUrl).then(r => r.text()).then(text => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(text, 'text/html');
                const anchors = Array.from(doc.querySelectorAll('a'));
                const htmlFiles = anchors
                    .map(a => ({ href: a.getAttribute('href') }))
                    .filter(a => a.href && a.href.endsWith('.html') && !/index\.html$/.test(a.href))
                    .map(a => ({ href: a.href, title: a.href.replace(/\/$/, '') }));
                if (htmlFiles.length) {
                    render(htmlFiles);
                    q.addEventListener('input', () => filterAndRender(htmlFiles));
                } else {
                    // 3) Fallback to manual pagesList array declared above
                    render(pagesList);
                    q.addEventListener('input', () => filterAndRender(pagesList));
                }
            }).catch(() => {
                render(pagesList);
                q.addEventListener('input', () => filterAndRender(pagesList));
            });
        });
    </script>
</body>
</html>
