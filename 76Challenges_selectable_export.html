<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>76 Challenges Dashboard</title>
<style>
body { font-family: Arial, sans-serif; margin: 20px; background-color: #f9f9f9; }
h1 { text-align: center; margin-bottom: 20px; }
#app { max-width: 1200px; margin: auto; padding: 10px; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
button { margin: 10px; padding: 12px 20px; font-size: 16px; border: none; border-radius: 5px; cursor: pointer; background-color: #0078D7; color: #fff; }
button:hover { background-color: #005fa3; }
textarea { width: 100%; height: 300px; margin-top: 20px; font-family: monospace; font-size: 14px; padding: 10px; border-radius: 5px; border: 1px solid #ccc; resize: none; }
input[type=checkbox] { margin-right: 8px; }
@media (max-width: 768px) { button { width: 100%; margin-top: 10px; } }
</style>
<script src='https://cdnjs.cloudflare.com/ajax/libs/ical.js/1.4.0/ical.min.js'></script>
</head>
<body>
<h1>Fallout 76 Challenges Dashboard</h1>
<div id='app'></div>
<div style='text-align:center;'>
    <button id='exportBtn'>Export Dashboard</button>
    <button id='copyBtn'>Copy Markdown</button>
</div>
<textarea id='markdownOutput' readonly placeholder='Markdown export will appear here'></textarea>
<script>
async function loadChallenges() {
    const response = await fetch('challenges.txt');
    const text = await response.text();
    const lines = text.trim().split('
');
    const categories = { Daily: [], Weekly: [], Monthly: [], Event: [] };
    lines.forEach(line => {
        const parts = line.split('|');
        if (parts.length >= 2) {
            const challenge = parts[0];
            const type = parts[1];
            const reward = parts[3] || '';
            if (categories[type]) { categories[type].push({ text: `${challenge} - Reward: ${reward}` }); }
        }
    });
    const container = document.createElement('div');
    container.innerHTML = '<h2>Challenges</h2>';
    for (const [key, value] of Object.entries(categories)) {
        const section = document.createElement('div');
        section.innerHTML = `<h3>${key} Challenges</h3>`;
        const list = document.createElement('ul');
        value.forEach((ch, index) => {
            const li = document.createElement('li');
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.className = 'challenge-checkbox';
            checkbox.dataset.text = ch.text;
            li.appendChild(checkbox);
            li.appendChild(document.createTextNode(ch.text));
            list.appendChild(li);
        });
        section.appendChild(list);
        container.appendChild(section);
    }
    document.getElementById('app').appendChild(container);
}

async function fetchCalendar(url) {
    try {
        const response = await fetch(url);
        const text = await response.text();
        const jcalData = ICAL.parse(text);
        const comp = new ICAL.Component(jcalData);
        const events = comp.getAllSubcomponents('vevent');
        const eventsContainer = document.createElement('div'); eventsContainer.id = 'events'; eventsContainer.innerHTML = '<h2>Current Events</h2>'; const list = document.createElement('ul');
        events.forEach(event => { const e = new ICAL.Event(event); const li = document.createElement('li'); li.textContent = `${e.summary} (Ends: ${e.endDate.toJSDate().toDateString()})`; list.appendChild(li); });
        eventsContainer.appendChild(list); document.getElementById('app').appendChild(eventsContainer);
    } catch (err) { console.error('Error fetching calendar:', err); }
}

function axolotlRotation() {
    const now = new Date(); const year = now.getFullYear();
    const axolotlMap = [
        {name: 'Charcoal Axolotl', regions: 'Skyline Valley & Savage Divide'},
        {name: 'Pink Axolotl', regions: 'Cranberry Bog & Forest'},
        {name: 'Clay Axolotl', regions: 'Skyline Valley & Toxic Valley'},
        {name: 'Dotted Axolotl', regions: 'Mire & Ash Heap'},
        {name: 'Purple Axolotl', regions: 'Skyline Valley & Cranberry Bog'},
        {name: 'Banded Axolotl', regions: 'Toxic Valley & Mire'},
        {name: 'Scaled Axolotl', regions: 'Forest & Ash Heap'},
        {name: 'Striped Axolotl', regions: 'Skyline Valley & Mire'},
        {name: 'Shadow Axolotl', regions: 'Toxic Valley & Ash Heap'},
        {name: 'Spotted Axolotl', regions: 'Savage Divide & Toxic Valley'},
        {name: 'Speckled Axolotl', regions: 'Cranberry Bog & Forest'},
        {name: 'Stone Axolotl', regions: 'Toxic Valley & Ash Heap'}
    ];
    function firstTuesday(month) { const date = new Date(year, month, 1); while (date.getDay() !== 2) { date.setDate(date.getDate() + 1); } return date; }
    let currentIndex = 0; for (let i = 11; i >= 0; i--) { if (now >= firstTuesday(i)) { currentIndex = i; break; } }
    const currentAxolotl = axolotlMap[currentIndex]; const nextChangeDate = firstTuesday((currentIndex + 1) % 12);
    const container = document.createElement('div'); container.id = 'axolotl'; container.innerHTML = `<h2>Monthly Axolotl</h2><p><strong>${currentAxolotl.name}</strong><br>Regions: ${currentAxolotl.regions}<br>Changes on: ${nextChangeDate.toDateString()}</p>`; document.getElementById('app').appendChild(container);
}

async function minervaStatus() {
    const locationResponse = await fetch('MinervaLocation.txt');
    const inventoryResponse = await fetch('MinervaEnventory.txt');
    const locationText = await locationResponse.text();
    const inventoryText = await inventoryResponse.text();
    const locations = locationText.trim().split('
').map(line => { const [start, end, loc, lists] = line.split(','); return { start: new Date(start), end: new Date(end), location: loc, lists: lists.split('|') }; });
    const inventory = inventoryText.trim().split('
').map(line => { const [list, item, cost] = line.split('|'); return { list: list, item: item, cost: parseInt(cost) }; });
    const now = new Date(); let currentLocation = 'Away'; let nextLocation = ''; let currentLists = [];
    locations.forEach(loc => { if (now >= loc.start && now <= loc.end) { currentLocation = loc.location; currentLists = loc.lists; } if (!nextLocation && loc.start >= now) { nextLocation = `She will next be at ${loc.location} on ${loc.start.toDateString()}`; } });
    const container = document.createElement('div'); container.id = 'minerva'; container.innerHTML = '<h2>Minerva</h2>';
    if (currentLocation === 'Away') { container.innerHTML += `<p><strong>Minerva's Location:</strong> ${currentLocation}<br>${nextLocation}</p>`; } else { container.innerHTML += `<p><strong>Minerva's Location:</strong> ${currentLocation}</p>`; const list = document.createElement('ul'); inventory.forEach(item => { if (currentLists.includes(item.list)) { const discounted = Math.round(item.cost * 0.75); const li = document.createElement('li'); li.textContent = `${item.item} (${discounted} gold)`; list.appendChild(li); } }); container.appendChild(list); }
    document.getElementById('app').appendChild(container);
}

document.getElementById('exportBtn').addEventListener('click', () => {
    let markdown = '# Fallout 76 Dashboard

';
    markdown += '## Monthly Axolotl
' + (document.getElementById('axolotl')?.innerText || '') + '

';
    markdown += '## Minerva
' + (document.getElementById('minerva')?.innerText || '') + '

';
    markdown += '## Current Events
';
    document.querySelectorAll('#events li').forEach(li => { markdown += `- ${li.innerText}
`; });
    markdown += '
## Selected Challenges
';
    document.querySelectorAll('.challenge-checkbox:checked').forEach(cb => { markdown += `- ${cb.dataset.text}
`; });
    document.getElementById('markdownOutput').value = markdown;
    const blob = new Blob([markdown], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'dashboard_export.md'; a.click(); URL.revokeObjectURL(url);
});

document.getElementById('copyBtn').addEventListener('click', () => {
    const textarea = document.getElementById('markdownOutput');
    textarea.select();
    document.execCommand('copy');
    alert('Markdown copied to clipboard!');
});

document.addEventListener('DOMContentLoaded', () => {
    loadChallenges();
    fetchCalendar('https://calendar.google.com/calendar/ical/677a43e0ffb5d922130f03876fe8c0bea6cb2fa558a7f50574cbbaa75564c74e%40group.calendar.google.com/public/basic.ics');
    axolotlRotation();
    minervaStatus();
});
</script>
</body>
</html>
